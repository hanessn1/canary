canary:
    application:
        name: Canary Backend
    ai:
        service-url: ${CANARY_AI_SERVICE_URL:http://localhost:8000}
    documents:
        upload-directory: storage/uploads
        max-upload-size: 10MB
        allowed-content-types:
            - application/pdf
            - text/plain
            - text/markdown
            - application/vnd.openxmlformats-officedocument.wordprocessingml.document
        allowed-extensions:
            - pdf
            - txt
            - md
            - docx

spring:
    application:
        name: backend
    servlet:
        multipart:
            max-file-size: ${canary.documents.max-upload-size}
            max-request-size: ${canary.documents.max-upload-size}

management:
    endpoints:
        web:
            exposure:
                include: health,info
    endpoint:
        health:
            probes:
                enabled: true

logging:
    level:
        com.canary.backend: INFO
