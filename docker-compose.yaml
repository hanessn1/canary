services:
    ai:
        image: hanessn/canary-ai:latest
        build:
            context: .
            dockerfile: ai/Dockerfile
        ports:
            - "8000:8000"
        environment:
            OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
            STORAGE_DIR: /app/storage
        volumes:
            - document-storage:/app/storage
        extra_hosts:
            - "host.docker.internal:host-gateway"
        healthcheck:
            test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
            interval: 10s
            timeout: 3s
            retries: 12

    backend:
        image: hanessn/canary-backend:latest
        build:
            context: .
            dockerfile: backend/Dockerfile
        ports:
            - "8080:8080"
        environment:
            CANARY_AI_SERVICE_URL: http://ai:8000
            CANARY_DOCUMENTS_UPLOAD_DIRECTORY: /app/storage/uploads
        volumes:
            - document-storage:/app/storage
        depends_on:
            ai:
                condition: service_healthy
        healthcheck:
            test: [ "CMD", "curl", "--fail", "http://localhost:8080/actuator/health" ]
            interval: 10s
            timeout: 3s
            retries: 6

    frontend:
        image: hanessn/canary-frontend:latest
        build:
            context: .
            dockerfile: frontend/Dockerfile
        ports:
            - "3000:80"
        depends_on:
            backend:
                condition: service_healthy

volumes:
    document-storage:
