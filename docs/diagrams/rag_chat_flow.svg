<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" width="840" height="460" style="--bg:#1F1F1F;--fg:#CCCCCC;--line:#CCCCCC;--accent:#0078D4;--muted:#CCCCCCCC;--surface:#181818;--border:#CCCCCC;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         #22d3ee;
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   #06b6d4;
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
  }
</style>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" />
  </marker>
</defs>

<!-- Connection Polylines -->
<polyline points="720,70 720,180 620,180 620,195" fill="none" stroke="var(--_line)" stroke-width="1.2" marker-end="url(#arrow)" />
<polyline points="570,195 570,110 330,110 330,70" fill="none" stroke="var(--_line)" stroke-width="1.2" marker-end="url(#arrow)" />
<polyline points="270,70 270,170 190,170 190,250" fill="none" stroke="var(--_line)" stroke-width="1.2" marker-end="url(#arrow)" />
<polyline points="300,70 300,120 440,120 440,200" fill="none" stroke="var(--_line)" stroke-width="1.2" marker-end="url(#arrow)" />
<polyline points="330,70 330,140 440,140 440,345" fill="none" stroke="var(--_line)" stroke-width="1.2" marker-end="url(#arrow)" />
<polyline points="240,70 240,250" fill="none" stroke="var(--_line)" stroke-width="1.2" marker-end="url(#arrow)" />
<polyline points="200,285 200,380 570,380 570,232" fill="none" stroke="var(--_line)" stroke-width="1.2" marker-end="url(#arrow)" />

<!-- Step Labels -->
<g class="label">
  <rect x="640" y="125" width="160" height="26" rx="4" fill="var(--bg)" stroke="var(--_inner-stroke)" />
  <text x="720" y="142" text-anchor="middle" font-size="11" fill="#22d3ee">1. Prompt (POST /chat/stream)</text>
</g>

<g class="label">
  <rect x="420" y="95" width="140" height="26" rx="4" fill="var(--bg)" stroke="var(--_inner-stroke)" />
  <text x="490" y="112" text-anchor="middle" font-size="11" fill="var(--_text-sec)">2. Proxy /api/v1/chat</text>
</g>

<g class="label">
  <rect x="110" y="160" width="140" height="26" rx="4" fill="var(--bg)" stroke="var(--_inner-stroke)" />
  <text x="180" y="177" text-anchor="middle" font-size="11" fill="var(--_text-sec)">3. Embed Query Vector</text>
</g>

<g class="label">
  <rect x="360" y="140" width="160" height="26" rx="4" fill="var(--bg)" stroke="var(--_inner-stroke)" />
  <text x="440" y="157" text-anchor="middle" font-size="11" fill="var(--_text-sec)">4. FAISS Dense Cosine Search</text>
</g>

<g class="label">
  <rect x="360" y="270" width="160" height="26" rx="4" fill="var(--bg)" stroke="var(--_inner-stroke)" />
  <text x="440" y="287" text-anchor="middle" font-size="11" fill="var(--_text-sec)">5. BM25 Keyword Scoring</text>
</g>

<g class="label">
  <rect x="140" y="210" width="180" height="26" rx="4" fill="var(--bg)" stroke="var(--_inner-stroke)" />
  <text x="230" y="227" text-anchor="middle" font-size="11" fill="var(--_text-sec)">6. Hybrid Score (0.7*Dense + 0.3*BM25)</text>
</g>

<g class="label">
  <rect x="310" y="370" width="190" height="26" rx="4" fill="var(--bg)" stroke="var(--_inner-stroke)" />
  <text x="405" y="387" text-anchor="middle" font-size="11" fill="#22d3ee">7. SSE Token Stream &amp; Citations</text>
</g>

<!-- Nodes -->
<g class="node">
  <rect x="660" y="35" width="120" height="35" rx="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="720" y="57" text-anchor="middle" font-size="13" font-weight="600" fill="var(--_text)">Web Client UI</text>
</g>

<g class="node">
  <rect x="510" y="195" width="140" height="37" rx="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="580" y="218" text-anchor="middle" font-size="13" font-weight="600" fill="var(--_text)">Java Backend API</text>
</g>

<g class="node">
  <rect x="220" y="35" width="160" height="35" rx="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="300" y="57" text-anchor="middle" font-size="13" font-weight="600" fill="var(--_text)">Python AI Engine</text>
</g>

<g class="node">
  <rect x="130" y="250" width="130" height="35" rx="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="195" y="272" text-anchor="middle" font-size="13" font-weight="600" fill="var(--_text)">Ollama Server</text>
</g>

<g class="node">
  <rect x="380" y="200" width="120" height="35" rx="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="440" y="222" text-anchor="middle" font-size="13" font-weight="600" fill="var(--_text)">FAISS Vector Store</text>
</g>

<g class="node">
  <rect x="380" y="345" width="120" height="35" rx="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="440" y="367" text-anchor="middle" font-size="13" font-weight="600" fill="var(--_text)">BM25 Re-Ranker</text>
</g>

</svg>
